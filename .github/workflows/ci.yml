name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (py${{ matrix.python }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.8 is not in the tool cache on ubuntu-latest any more
          - {os: ubuntu-22.04, python: "3.8"}
          - {os: ubuntu-latest, python: "3.9"}
          - {os: ubuntu-latest, python: "3.10"}
          - {os: ubuntu-latest, python: "3.11"}
          - {os: ubuntu-latest, python: "3.12"}
          - {os: ubuntu-latest, python: "3.13"}
          - {os: macos-latest, python: "3.12"}
          - {os: windows-latest, python: "3.12"}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Byte-compile every module
        run: python -m compileall -q mocksap tests examples
      - name: Run the test suite
        run: python -m unittest discover -s tests -v

  docs:
    name: documentation covers every file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The changelog check compares against the base of the pull request,
          # so it needs more than the tip commit.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python tools/check_docs.py
      - name: The changelog is well formed and has lost nothing
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          LABELS="${{ join(github.event.pull_request.labels.*.name, ',') }}"
          python tools/check_changelog.py ${BASE:+--base "$BASE"} --labels "$LABELS"

  csdl:
    name: "served $metadata is valid CSDL"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Its own job so that a failure names itself. Everything else that checks
      # this mock's output checks it against mocksap/schema.py, which is what
      # wrote it; this is the one check held to schemas nobody here wrote, and a
      # confusing test error is not what it should arrive as.
      #
      # --require because the validation needs xmllint, which the runner image
      # has: without the flag a runner that stopped shipping libxml2 would turn
      # this job green by skipping the only part that needs it.
      - run: python tools/check_csdl.py --require

  smoke:
    name: documented examples still work
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run the documented curl tour and the example client
        run: |
          set -euo pipefail
          python -m mocksap --port 8000 -q &
          MOCK_PID=$!
          trap 'kill $MOCK_PID 2>/dev/null || true' EXIT
          for _ in $(seq 1 40); do
            curl -sf http://127.0.0.1:8000/_mock/health >/dev/null && break
            sleep 0.25
          done
          curl -sf http://127.0.0.1:8000/_mock/health
          bash examples/demo.sh
          python examples/client.py

  package:
    name: package builds and installs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Install the wheel and run the console script
        run: |
          set -eu
          python -m pip install dist/*.whl
          # __version__ is derived from the installed metadata: prove it matches
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "$(mock-sap --version)" = "mock-sap $VERSION"
          test "$(cd /tmp && python -c 'import mocksap; print(mocksap.__version__)')" = "$VERSION"
          mock-sap --port 8001 -q &
          for _ in $(seq 1 40); do
            curl -sf http://127.0.0.1:8001/_mock/health && break
            sleep 0.25
          done
          curl -sf "http://127.0.0.1:8001/sap/opu/odata/sap/API_SALES_ORDER_SRV/A_SalesOrder/\$count"
      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/*

  docker:
    name: container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t mock-sap:ci .
      - name: Run it and query the catalog
        run: |
          docker run -d --name mock-sap -p 8000:8000 mock-sap:ci
          for _ in $(seq 1 40); do
            curl -sf http://127.0.0.1:8000/_mock/health >/dev/null && break
            sleep 0.5
          done
          curl -sf "http://127.0.0.1:8000/sap/opu/odata/IWFND/CATALOGSERVICE;v=2/ServiceCollection?\$format=json" | head -5
          docker rm -f mock-sap

  all-green:
    name: all green
    # The single check required on main. The matrix job names carry the Python
    # version and the runner, so they change whenever the matrix does, and a
    # required check whose name no longer exists blocks every merge instead of
    # failing loudly. This one keeps its name while the matrix moves underneath.
    #
    # That name is load-bearing. The `Main Protect` ruleset requires the context
    # `all green` literally, and it has no bypass actors - nobody, including the
    # owner, can merge past it. Rename or delete this job and the required check
    # never reports, so every pull request becomes permanently unmergeable with
    # no way round it from the pull request side. Change the ruleset first; see
    # docs/GITHUB.md.
    needs: [test, docs, csdl, smoke, package, docker]
    # Without always(), a failed dependency skips this job rather than failing
    # it, and a skipped check is not a red one.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every job this release depends on succeeded
        run: |
          set -eu
          results="${{ join(needs.*.result, ' ') }}"
          echo "results: $results"
          for result in $results; do
            case "$result" in
              success) ;;
              *) echo "a job did not succeed ($result); see the run" >&2; exit 1 ;;
            esac
          done
