[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mock-sap"
version = "0.5.0"
description = "A black-box mock SAP endpoint: OData V2, BAPI/RFC and IDoc shapes over SQLite, with zero dependencies."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["sap", "odata", "mock", "bapi", "rfc", "idoc", "s4hana", "testing", "integration"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
  "Topic :: Software Development :: Testing",
  "Topic :: Software Development :: Testing :: Mocking",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/rseufert/mock-sap"
Repository = "https://github.com/rseufert/mock-sap"
Issues = "https://github.com/rseufert/mock-sap/issues"
Changelog = "https://github.com/rseufert/mock-sap/releases"

[project.scripts]
mock-sap = "mocksap.__main__:main"

[tool.setuptools]
packages = ["mocksap"]
